{% extends "base.html" %}

{% block title %}Door Config - Room {{ room_id }}{% endblock %}

{% block content %}
<style>

body {
    background-color: #f5f7fb;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

.page-header {
    margin-bottom: 2rem;
}

.room-badge {
    background-color: #e0e7ff;
    color: #4361ee;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
}

.config-card {
    border: none;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    background-color: #ffffff;
    overflow: hidden;
}

.card-title-custom {
    font-weight: 700;
    color: #2d3748;
    display: flex;
    align-items: center;
    gap: 10px;
}

.group-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 1.5rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
}

.group-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #f1f5f9;
}

.form-label {
    font-weight: 600;
    color: #4a5568;
    font-size: 0.85rem;
}

.form-control {
    border-radius: 12px;
    padding: 0.75rem 1rem;
    border: 1px solid #e2e8f0;
    background-color: #f8fafc;
    transition: all 0.2s;
}

.form-control[readonly] {
    background-color: #f1f5f9;
    color: #64748b;
    cursor: not-allowed;
}

.btn {
    border-radius: 12px;
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    transition: all 0.2s;
}

</style>


<div class="container py-4">

    <!-- HEADER -->

    <div class="page-header d-flex justify-content-between align-items-center">

        <div>
            <h2 class="fw-bold text-dark mb-1">
                Door System Config
            </h2>

            <span class="room-badge">
                <i class="bi bi-door-closed-fill me-1"></i>
                Room ID: {{ room_id }}
            </span>

        </div>

    </div>



    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card config-card shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <!-- TITLE -->

                    <div class="d-flex justify-content-between align-items-center mb-2">

                        <h5 class="card-title-custom mb-0">

                            <i class="bi bi-shield-lock text-primary"></i>

                            Access Configuration

                        </h5>

                        <button id="edit-btn"
                                class="btn btn-light border btn-sm px-3">

                            <i class="bi bi-pencil-square me-1"></i>
                            Edit

                        </button>

                    </div>



                    <form method="POST"
                          action="{{ url_for('config_door',
                          node_id=node.node_id if node else 0) }}">


                        <!-- COMMUNICATION -->

                        <div class="group-label">
                            Communication
                        </div>

                        <div class="row g-3">

                            <div class="col-md-8">

                                <label class="form-label">
                                    MQTT Broker
                                </label>

                                <input type="text"
                                       id="mqtt_broker"
                                       name="mqtt_broker"
                                       class="form-control"
                                       value="{{ config.mqtt_broker if config else '' }}"
                                       readonly required>

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">
                                    Port
                                </label>

                                <input type="number"
                                       id="mqtt_port"
                                       name="mqtt_port"
                                       class="form-control"
                                       value="{{ config.mqtt_port if config else '' }}"
                                       readonly required>

                            </div>

                        </div>



                        <!-- COMMANDS -->

                        <div class="group-label">
                            Lock Commands
                        </div>


                        <div class="mb-3">

                            <label class="form-label text-success">

                                <i class="bi bi-unlock me-1"></i>
                                OPEN Command

                            </label>

                            <input type="text"
                                   id="command_door_open"
                                   name="command_door_open"
                                   class="form-control"
                                   value="{{ config.command_door_open if config else '' }}"
                                   readonly required>

                        </div>



                        <div class="mb-3">

                            <label class="form-label text-danger">

                                <i class="bi bi-lock me-1"></i>
                                CLOSE Command

                            </label>

                            <input type="text"
                                   id="command_door_close"
                                   name="command_door_close"
                                   class="form-control"
                                   value="{{ config.command_door_close if config else '' }}"
                                   readonly required>

                        </div>



                        <!-- SAVE -->

                        <div class="mt-4">

                            <button type="submit"
                                    id="save-btn"
                                    class="btn btn-primary w-100 shadow-sm"
                                    style="display:none;">

                                <i class="bi bi-save2 me-2"></i>

                                {{ "Update Configuration"
                                   if config
                                   else "Save Configuration" }}

                            </button>

                        </div>


                    </form>



                    {% if config %}

                    <div class="mt-4 pt-3 border-top">

                        <form method="post"
                              action="{{ url_for('delete_door_config',
                              node_id=node.node_id) }}"
                              onsubmit="return confirm('Delete this configuration?')">

                            <button type="submit"
                                    class="btn btn-link text-danger p-0 text-decoration-none small">

                                <i class="bi bi-trash3 me-1"></i>
                                Remove this configuration

                            </button>

                        </form>

                    </div>

                    {% endif %}



                </div>

            </div>

        </div>

    </div>

</div>



<script>

document.getElementById('edit-btn').addEventListener('click', function() {

    document.querySelectorAll('input').forEach(i => {

        i.removeAttribute('readonly')
        i.style.backgroundColor = '#ffffff'

    })

    document.getElementById('save-btn').style.display = 'block'

    this.classList.add('d-none')

})

</script>

{% endblock %}
