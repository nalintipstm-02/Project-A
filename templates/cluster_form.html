{% extends "base.html" %}

{% block title %}{{ 'Edit' if cluster else 'Add' }} Cluster{% endblock %}

{% block content %}
<style>
    body {
        background-color: #f5f7fb;
    }

    /* ตกแต่ง Card ของฟอร์ม */
    .form-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        background-color: #ffffff;
        max-width: 550px;
        margin: 3rem auto;
    }

    /* ปรับแต่ง Label และ Input */
    .form-label {
        font-weight: 600;
        color: #4a5568;
        margin-bottom: 0.6rem;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .form-control {
        border-radius: 12px;
        padding: 0.8rem 1rem;
        border: 1px solid #e2e8f0;
        transition: all 0.2s ease;
        background-color: #f8fafc;
    }

    .form-control:focus {
        border-color: #4361ee;
        box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        background-color: #ffffff;
        outline: none;
    }

    /* ตกแต่งปุ่ม */
    .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.2s;
    }

    .btn-primary {
        background-color: #4361ee;
        border: none;
    }

    .btn-primary:hover {
        background-color: #3751d4;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
    }

    .btn-secondary {
        background-color: #f1f5f9;
        border: none;
        color: #64748b;
    }

    .btn-secondary:hover {
        background-color: #e2e8f0;
        color: #475569;
    }

    .page-title {
        color: #2d3748;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .icon-box {
        width: 55px;
        height: 55px;
        background: rgba(67, 97, 238, 0.1);
        color: #4361ee;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        margin: 0 auto 1.5rem;
    }
</style>

<div class="container py-5">
    <div class="card form-card">
        <div class="card-body p-4 p-md-5">
            <!-- Header -->
            <div class="text-center">
                <div class="icon-box shadow-sm">
                    <i class="bi bi-grid-3x3-gap-fill fs-4"></i>
                </div>
                <h2 class="page-title mb-1">{{ 'Edit' if cluster else 'Add' }} Cluster</h2>
                <p class="text-muted small mb-4">
                    {% if cluster %}
                        Modify the details for this group
                    {% else %}
                        Create a new logical cluster for rooms
                    {% endif %}
                </p>
            </div>

            <form method="post">
                <div class="mb-4">
                    <label for="cluster_name" class="form-label">
                        <i class="bi bi-tag-fill me-1 text-primary"></i> Cluster Name
                    </label>
                    <input type="text" class="form-control fw-medium" id="cluster_name" name="cluster_name" 
                           placeholder="เช่น ชั้น3" required
                           value="{{ cluster.cluster_name if cluster else '' }}">
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5 border-top pt-4">
                    <button type="button"
                            class="btn btn-secondary px-4 me-md-2"
                            data-url="{{ url_for('clusters', building_id=building_id) }}"
                            onclick="window.location.replace(this.dataset.url)">
                            Cancel
                    </button>
                    <button type="submit" class="btn btn-primary px-5 shadow-sm">
                        <i class="bi bi-check-circle-fill me-2"></i>{{ 'Update Cluster' if cluster else 'Save Cluster' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
