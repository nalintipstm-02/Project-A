{% extends "base.html" %}

{% block title %}Add Room{% endblock %}

{% block content %}
<style>
    body {
        background-color: #f5f7fb;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* ตกแต่ง Card ของฟอร์ม */
    .form-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        background-color: #ffffff;
        max-width: 600px;
        margin: 2rem auto;
    }

    /* ปรับแต่ง Label และ Input */
    .form-label {
        font-weight: 600;
        color: #4a5568;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
    }

    .form-control {
        border-radius: 12px;
        padding: 0.75rem 1rem;
        border: 1px solid #e2e8f0;
        transition: all 0.2s ease;
        background-color: #f8fafc;
    }

    .form-control:focus {
        border-color: #4361ee;
        box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        background-color: #ffffff;
        outline: none;
    }

    /* ตกแต่งปุ่ม */
    .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.2s;
    }

    .btn-primary {
        background-color: #4361ee;
        border: none;
    }

    .btn-primary:hover {
        background-color: #3751d4;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
    }

    .btn-secondary {
        background-color: #f1f5f9;
        border: none;
        color: #64748b;
    }

    .btn-secondary:hover {
        background-color: #e2e8f0;
        color: #475569;
    }

    .page-title {
        color: #2d3748;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    /* Header Icon */
    .room-header-icon {
        width: 55px;
        height: 55px;
        background: rgba(67, 97, 238, 0.1);
        color: #4361ee;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        margin: 0 auto 1.5rem;
        font-size: 1.5rem;
    }
</style>

<div class="container py-5">
    <div class="card form-card">
        <div class="card-body p-4 p-md-5">
            
            <!-- Header Section -->
            <div class="text-center mb-5">
                <div class="room-header-icon shadow-sm">
                    <i class="bi bi-door-open-fill"></i>
                </div>
                <h2 class="page-title mb-1">เพิ่มห้องใหม่</h2>
                <p class="text-muted small">ลงทะเบียนห้องเรียนใหม่</p>
            </div>

            <form method="post">
                <!-- Room Name -->
                <div class="mb-4">
                    <label for="room_name" class="form-label text-muted small text-uppercase">
                        <i class="bi bi-tag-fill me-1 text-primary"></i> ชื่อห้อง
                    </label>
                    <input type="text" class="form-control fw-medium" id="room_name" name="room_name" 
                           placeholder="กรอกห้องเรียน" required>
                </div>

                <!-- Floor Number -->
                <div class="mb-4">
                    <label for="floor_number" class="form-label text-muted small text-uppercase">
                        <i class="bi bi-layers me-1 text-primary"></i> ชั้นเรียน
                    </label>
                    <input type="number" class="form-control" id="floor_number" name="floor_number" 
                           placeholder="กรอกชั้นเรียน" required>
                </div>

                <!-- Room Type -->
                <div class="mb-5">
                    <label for="room_type" class="form-label text-muted small text-uppercase">
                        <i class="bi bi-info-circle me-1 text-primary"></i> ประเภทของห้อง
                    </label>
                    <input type="text" class="form-control" id="room_type" name="room_type" 
                           placeholder="รายละเอียดของห้อง" required>
                </div>

                <!-- Action Buttons -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 border-top pt-4">
                    <button type="button"
                            onclick="history.back()"
                            class="btn btn-secondary px-4 me-md-2">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary px-5 shadow-sm">
                        <i class="bi bi-check2-circle me-2"></i>Save
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
